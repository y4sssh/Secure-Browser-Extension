<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe Login Host</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f6f7f9;
        color: #17202a;
      }

      main {
        width: min(560px, calc(100vw - 32px));
      }

      iframe {
        width: 100%;
        min-height: 320px;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Embedded account portal</h1>
      <iframe title="Secure login frame" src="./frame.html"></iframe>
    </main>
  </body>
</html>
