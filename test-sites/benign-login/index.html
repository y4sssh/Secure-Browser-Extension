<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Benign Login - Test Site</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial; max-width:720px; margin:40px auto; padding:20px; }
    .card { border:1px solid #ddd; padding:20px; border-radius:8px; }
    label { display:block; margin:8px 0 4px; }
    input { padding:8px; width:100%; box-sizing:border-box; }
    button { margin-top:12px; padding:8px 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Acme Portal</h1>
    <p>This is a benign test login page hosted on the same origin as the form action.</p>

    <form id="login" action="/login" method="post">
      <label for="user">Email or username</label>
      <input id="user" name="username" type="text" autocomplete="username" />

      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" />

      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
